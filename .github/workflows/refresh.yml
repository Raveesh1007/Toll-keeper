name: refresh
on:
  schedule: [{cron: "17 1 * * *"}]   # daily, 01:17 UTC (DefiLlama has closed the previous day)
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: refresh, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # build.py reads the pre-registration commit from git history
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: github.event_name != 'push'
        run: python collect.py
      - run: python test_build.py && python build.py
      - name: commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data THESIS.md site
          git diff --cached --quiet || (git commit -m "data refresh $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
